<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WBTET Mock Tests 2026 | EduCare C.C.</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
scroll-behavior:smooth;
}

body{
font-family:Arial,sans-serif;
background:#f4f8ff;
color:#172033;
line-height:1.6;
}

/* HEADER */

header{
background:linear-gradient(135deg,#061b4f,#064c9b,#00a9d9);
color:white;
padding:30px 15px;
text-align:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

.tagline{
margin-top:6px;
font-size:14px;
}

/* NAVIGATION */

nav{
background:#041535;
padding:10px 8px;
display:flex;
justify-content:center;
gap:8px;
flex-wrap:wrap;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 3px 15px rgba(0,0,0,.2);
}

nav a{
color:white;
text-decoration:none;
padding:9px 13px;
border-radius:20px;
font-size:14px;
font-weight:bold;
}

nav a:hover{
background:#00a9d9;
}

/* CONTAINER */

.container{
max-width:1000px;
margin:25px auto;
padding:0 15px;
}

/* BACK */

.back{
display:inline-block;
margin-bottom:18px;
color:#064c9b;
text-decoration:none;
font-weight:bold;
}

/* MAIN TITLE */

.main-title{
text-align:center;
color:#064c9b;
font-size:28px;
margin-bottom:22px;
}

/* MAIN MOCK TEST BOX */

.exam-box{
background:linear-gradient(135deg,#061b4f,#064c9b,#087fc1);
color:white;
padding:28px;
border-radius:22px;
box-shadow:0 8px 25px rgba(0,80,160,.25);
}

/* EXAM TITLE */

.exam-box h1{
text-align:center;
font-size:27px;
margin-bottom:8px;
}

.intro{
text-align:center;
font-size:15px;
color:#eaf7ff;
margin-bottom:24px;
}

/* SUBJECT GRID */

.subject-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
}

/* SUBJECT CARD */

.subject{
background:white;
color:#172033;
border-radius:18px;
padding:24px 14px;
min-height:190px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

text-align:center;

box-shadow:0 5px 15px rgba(0,0,0,.14);

transition:.2s;
}

.subject:hover{
transform:translateY(-4px);
}

.subject h2{
color:#064c9b;
font-size:20px;
margin-bottom:8px;
}

.subject p{
font-size:13px;
color:#687386;
margin-bottom:16px;
}

/* START BUTTON */

.start-btn{
display:inline-block;

background:linear-gradient(135deg,#00a9d9,#008fd0);

color:white;

text-decoration:none;

padding:10px 18px;

border-radius:25px;

font-size:13px;

font-weight:bold;

box-shadow:0 4px 10px rgba(0,150,220,.25);
}

.start-btn:hover{
transform:translateY(-2px);
background:#064c9b;
}

/* COMING SOON */

.coming{
background:#eef2f7;
color:#697386;

padding:8px 15px;

border-radius:22px;

font-size:12px;

font-weight:bold;
}

/* FOOTER */

footer{
text-align:center;

margin-top:30px;

padding:20px;

font-size:12px;

color:#687386;
}

/* TABLET */

@media(max-width:800px){

.subject-grid{
grid-template-columns:repeat(2,1fr);
}

}

/* MOBILE */

@media(max-width:500px){

.container{
padding:0 10px;
}

.main-title{
font-size:23px;
}

.exam-box{
padding:18px 10px;
border-radius:18px;
}

.exam-box h1{
font-size:22px;
}

.intro{
font-size:13px;
}

.subject-grid{
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.subject{
min-height:165px;
padding:18px 7px;
}

.subject h2{
font-size:16px;
}

.subject p{
font-size:11px;
margin-bottom:12px;
}

.start-btn{
font-size:10px;
padding:8px 11px;
}

.coming{
font-size:10px;
padding:7px 10px;
}

}

/* VERY SMALL MOBILE */

@media(max-width:360px){

.subject-grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>


<header>

<div class="logo">
🎓 EduCare C.C.
</div>

<div class="tagline">
WBTET • CTET • TET • Teacher Preparation
</div>

</header>


<nav
