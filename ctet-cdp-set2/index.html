<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>CTET CDP Mock Test 2 | EduCare C.C.</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071d3f;color:#f4f8ff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}
.header{background:linear-gradient(110deg,#08265b,#00a8c9);padding:18px 12px 14px;text-align:center}
.logo{font-size:25px;font-weight:800;color:#fff}.logo span{color:#ffe33b}.tag{font-size:12px;margin-top:4px;color:#e6f8ff}
.wrap{width:min(760px,94%);margin:0 auto;padding:14px 0 28px}
.title{text-align:center;margin:5px 0 14px;font-size:23px;font-weight:800}
.subtitle{text-align:center;color:#b9c9dd;font-size:13px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#142f56;border:1px solid #385478;border-radius:14px;padding:12px;text-align:center;box-shadow:0 5px 18px #0003}
.stat small{display:block;color:#9fb2ca;font-size:10px;letter-spacing:.7px}.stat b{display:block;font-size:20px;margin-top:3px}
.progress{height:8px;background:#1a365b;border-radius:10px;overflow:hidden;margin:10px 0 15px}.bar{height:100%;width:0;background:#10d8e8;transition:.2s}
.card{background:#20385c;border:1px solid #46617f;border-radius:18px;padding:18px 16px 16px;box-shadow:0 10px 30px #0004}
.qno{color:#dcecff;font-size:14px;font-weight:800;margin-bottom:14px}
.question{font-size:18px;line-height:1.48;font-weight:700;margin-bottom:18px}
.options{display:grid;gap:10px}.opt{width:100%;border:1px solid #55718f;background:#30496b;color:#f6fbff;border-radius:13px;padding:14px;text-align:left;font-size:15px;line-height:1.35;cursor:pointer;transition:.15s}
.opt:hover{background:#3b567a}.opt.selected{background:#0bcfe2;color:#061c35;border-color:#67f3ff;font-weight:800}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
button{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}
.prev{background:#395276;color:#fff}.next{background:#10d8e8;color:#05213d}.submit{background:#ff4b4b;color:#fff;width:100%;margin-top:14px}
.result{display:none;background:#f7fbff;color:#122642;border-radius:18px;padding:20px;text-align:center;margin-top:15px}
.result h2{margin:0 0 8px;color:#0b4e98}.score{font-size:34px;font-weight:900;margin:10px}
.review{margin-top:15px;text-align:left}.review-item{padding:12px;border-radius:12px;background:#edf3fa;margin:8px 0;font-size:13px;line-height:1.4}
.correct{border-left:5px solid #16b957}.wrong{border-left:5px solid #ef4444}.unattempted{border-left:5px solid #64748b}
.footer{text-align:center;color:#8fa5bf;font-size:11px;margin-top:20px;line-height:1.5}
@media(max-width:520px){.wrap{width:94%;padding-top:10px}.title{font-size:21px}.question{font-size:16px}.opt{font-size:14px;padding:13px 12px}.stat b{font-size:18px}}
</style>
</head>
<body>
<header class="header"><div class="logo">🎓 EduCare <span>C.C.</span></div><div class="tag">WBTET • CTET • TET • Teacher Preparation</div></header>
<main class="wrap">
<div class="title">🧠 CTET CDP Mock Test 2</div>
<div class="subtitle">Child Development &amp; Pedagogy • 30 Questions • 30 Minutes</div>
<div class="stats"><div class="stat"><small>QUESTION</small><b id="counter">1 / 30</b></div><div class="stat"><small>TIME LEFT</small><b id="timer">30:00</b></div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<section class="card" id="quizCard">
<div class="qno" id="qno">Question 1 of 30</div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>
<div class="buttons"><button class="prev" id="prev">Previous</button><button class="next" id="next">Next</button></div>
</section>
<button class="submit" id="submit">Submit Test</button>
<section class="result" id="result"><h2>🎯 Test Result</h2><div class="score" id="score"></div><div id="summary"></div><div class="review" id="review"></div><button id="restart" style="background:#0b4e98;color:white;width:100%;margin-top:12px">Restart Test</button></section>
<div class="footer">© EduCare Coaching Centre (EduCare C.C.)<br>WBTET • CTET • TET • CDP Practice</div>
</main>
<script>
const questions=[{"q": "Rama was mean to her brother Tahir. Next day Tahir got sick. Rama concluded that she made her brother sick. According to Piaget, which stage of cognitive development is Rama in?", "o": ["Preoperational stage", "Concrete operational stage", "Formal operational stage", "Sensorimotor stage"], "a": 0, "e": "Piaget’s preoperational stage includes magical or non-logical causal thinking, such as believing that one’s action caused another event."}, {"q": "____ is the process by which children become aware of their gender roles.", "o": ["Gender equality", "Gender relatedness", "Gender homogeneity", "Gender typing"], "a": 3, "e": "Gender typing refers to the development of behaviours and expectations associated with being a boy or a girl in a culture."}, {"q": "Which of the following scenarios is aptly describing the application of Lev Vygotsky’s concept of ‘scaffolding’?", "o": ["A teacher has strictly prohibited students to have any kind of collaborations and communication with their peers.", "A teacher has written answers on the blackboard and has asked the students to copy the answers passively in their notebooks.", "A teacher has made it mandatory for her students to solve problems on their own in a set time period.", "A teacher gave half-solved problems to her students who were finding it difficult to solve them otherwise."], "a": 3, "e": "Scaffolding provides temporary support that helps learners complete a task they cannot yet complete independently."}, {"q": "Progressive education is an educational philosophy that emphasizes on ____.", "o": ["rote memorization and teacher-centered instruction", "standardized testing and strict curriculum guidelines", "competition and individual achievement", "student-centered learning and active participation"], "a": 3, "e": "Progressive education emphasizes active participation, learner-centred experiences, and meaningful learning."}, {"q": "Read the following statements:<br><br><b>Assertion (A)</b> : Children progress from understanding consequences of act to determine whether they are good/bad to understanding that rules and laws are flexible and can be changed.<br><b>Reason (R)</b> : According to Kohlberg, children’s moral development occurs in continuous manner and not a discontinuous one.<br><br>Choose the correct option.", "o": ["Both A and R are true but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false.", "Both A and R are true and R is the correct explanation of A."], "a": 1, "e": "The assertion describes progression in moral reasoning, while Kohlberg’s theory is stage-based rather than a single continuous process."}, {"q": "According to Lev Vygotsky, cognitive development is guided by", "o": ["processes of attention and perception", "assimilation and accommodation that change ‘schemes’", "positive and negative reinforcement given by the environment", "language in the form of private speech"], "a": 3, "e": "Vygotsky viewed language, including private speech, as an important tool in cognitive development."}, {"q": "Which of the following intelligence helps people to perceive, express, understand and regulate moods and feelings of others?", "o": ["Logical-mathematical", "Musical", "Naturalist", "Interpersonal"], "a": 3, "e": "Interpersonal intelligence concerns understanding and responding to other people’s feelings, moods and intentions."}, {"q": "A child’s first experience as well as expectations of what it means to be a ‘girl’ or a ‘boy’ comes from", "o": ["relatives", "neighbourhood", "family", "media"], "a": 2, "e": "Family is an early and important social context in which children encounter gender expectations and roles."}, {"q": "An essential characteristic of formative assessment is—", "o": ["tests and exams at the end of the year", "clarification of assessment criteria to the learners.", "to focus on quantitative means to achieve objectivity.", "to assign relative ranks and positions to learners."], "a": 1, "e": "Formative assessment supports ongoing learning, including making assessment criteria clear so learners can use feedback."}, {"q": "Dysgraphia is a", "o": ["personality disorder", "physical disability", "learning disability", "neurodevelopmental disorder"], "a": 2, "e": "Dysgraphia is commonly described as a learning disability affecting writing and written expression."}, {"q": "A teacher should cater to ____ needs of gifted children in the classrooms.", "o": ["cognitive and emotional", "cognitive and social", "cognitive, social and emotional", "cognitive"], "a": 2, "e": "Gifted learners have needs that can involve cognitive, social and emotional development, not academics alone."}, {"q": "Which of the following are examples of pedagogical approaches to teach students with learning disabilities?<br><br>(i) Use of multisensory strategies<br>(ii) Standardized learning goals<br>(iii) Flexible and sequential instructions<br>(iv) Breaking down tasks into smaller parts<br><br>Choose the correct option.", "o": ["(iii) and (iv)", "(i), (iii) and (iv)", "(i), (ii), (iii) and (iv)", "(i) and (ii)"], "a": 2, "e": "The source item treats all four listed approaches as examples of pedagogical approaches for students with learning disabilities."}, {"q": "Which of the following statements about Autism Spectrum Disorder is correct?", "o": ["Sensory integration and regulation help children with Autism Spectrum Disorder.", "It is primarily the ability to hear that is affected in Autism Spectrum Disorder.", "Children with Autism Spectrum Disorder exhibit a preference for new stimuli every day.", "Children with Autism Spectrum Disorder have excellent communication skills but very poor memory."], "a": 0, "e": "Sensory integration and regulation can support children with Autism Spectrum Disorder."}, {"q": "While teaching in inclusive setups, it is important that teachers—", "o": ["continuously examine their own implicit and preconceived bias.", "understand special needs of others only and depend on others.", "follow same curriculum and uniform pedagogy of all learners.", "see diversity as an obstacle to effective teaching."], "a": 0, "e": "Inclusive teaching requires teachers to reflect on implicit and preconceived biases and remove barriers to participation."}, {"q": "Read the following statements:<br><br><b>Assertion (A)</b> : Teachers should include a variety of children’s literature to create print-rich environment in the classroom.<br><b>Reason (R)</b> : Classrooms rich in literacy materials and literacy experiences are central to effective learning.<br><br>Choose the correct option.", "o": ["Both A and R are true but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false.", "Both A and R are true and R is the correct explanation of A."], "a": 3, "e": "A varied print-rich environment provides literacy materials and experiences, which supports effective literacy learning."}, {"q": "In order to facilitate students’ learning in a progressive classroom, a teacher should emphasize the practice of", "o": ["passive replication", "reflective thinking", "obedient listening", "behaviour conditioning"], "a": 1, "e": "Progressive classrooms encourage learners to reflect, question, participate and construct understanding."}, {"q": "Seeing Raman, a 4th grade student stuck on a question, his teacher asked him to try the solution while speaking what is going on in his mind. Such verbalization is likely to be—", "o": ["helpful because language facilitates thought process.", "supportive only for students with learning disabilities because they have difficulty in auditory processing.", "unproductive because language and thought are not related.", "futile because language hinders thought process."], "a": 0, "e": "Verbalization can support thinking because language helps learners organize and regulate their thought processes."}, {"q": "A teacher who believes in constructivist pedagogy would—", "o": ["avoid judgements of students solely on the basis of socio-cultural backgrounds.", "promote high levels of verbal instructions as primary pedagogy.", "promote ‘ability grouping’ of students.", "avoid connecting content to real world."], "a": 0, "e": "Constructivist teaching recognizes learners’ social and cultural contexts rather than judging them solely by background."}, {"q": "Active engagement of learners implies that the students—", "o": ["rote memorize facts and information.", "actively value marks and competition.", "consider textbook as the sole source of knowledge.", "inquire, explore and question."], "a": 3, "e": "Active engagement involves learners asking questions, exploring ideas and investigating rather than only memorizing."}, {"q": "Radha reasons, “Clothes dry faster in the sun than in the shade, so the sun is helping them to dry”. She is showing an understanding of—", "o": ["reversible thinking", "decentration", "animism", "cause and effect"], "a": 3, "e": "Radha is linking one event with another as a cause-and-effect relationship."}, {"q": "Which of the following is an example of intrinsic motivation?", "o": ["Playing a game for the prize money", "Playing a sport for personal enjoyment", "Completing the homework to avoid being scolded by parents", "Studying for a test to get good grade"], "a": 1, "e": "Intrinsic motivation comes from interest or enjoyment in the activity itself, rather than an external reward or punishment."}, {"q": "Read the following statements:<br><br><b>Assertion (A)</b> : Teachers who believe in constructivist pedagogy should provide a lot of materials to the children.<br><b>Reason (R)</b> : Young children depend solely on verbal instructions and lectures for meaningful learning.<br><br>Choose the correct option.", "o": ["Both A and R are true but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false.", "Both A and R are true and R is the correct explanation of A."], "a": 1, "e": "Constructivist classrooms can provide rich materials for active exploration, while young children do not depend solely on lectures."}, {"q": "Avoiding the appearance of low ability in front of peers and teachers is an example of", "o": ["performance approach goals", "task-involved goals", "performance avoidance goals", "mastery goals"], "a": 2, "e": "Performance-avoidance goals involve trying to avoid appearing incompetent or performing poorly in front of others."}, {"q": "Which of the following is an effective way to promote critical thinking in the classroom?", "o": ["Discouraging students from asking questions.", "Encouraging students to think independently and questioning assumptions.", "Providing students with a set of predetermined answers to choose from.", "Encouraging rote memorization of facts."], "a": 1, "e": "Critical thinking is supported when learners examine assumptions, ask questions and reason independently."}, {"q": "Read the following statements:<br><br><b>Assertion (A)</b> : Some children have characteristics that resemble their parents while others are markedly different from their parents.<br><b>Reason (R)</b> : Working out how much of any characteristic is due to nature or genes and how much is due to nurture or environment is a complex issue.<br><br>Choose the correct option.", "o": ["Both A and R are true but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false.", "Both A and R are true and R is the correct explanation of A."], "a": 3, "e": "The resemblance and differences among children reflect the complex interaction of heredity and environment, so the reason explains the assertion."}, {"q": "Which of the following statements about development is correct?", "o": ["Development is a simple and unitary process.", "Development can always be measured precisely.", "Development is multidimensional and multidirectional.", "Development in children can be predicted very accurately."], "a": 2, "e": "Development occurs across multiple dimensions and can involve gains, losses and different directions of change."}, {"q": "Read the following statements:<br><br><b>Assertion (A)</b> : The ability to comprehend and speak depends on the physical development of the mouth and brain.<br><b>Reason (R)</b> : Emotional development is related to physical growth.<br><br>Choose the correct option.", "o": ["Both A and R are true but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false.", "Both A and R are true and R is the correct explanation of A."], "a": 1, "e": "The assertion links speech with physical structures, but the reason about emotional development does not explain that relationship."}, {"q": "Most children can speak five-six coherent sentences at", "o": ["three years", "five years", "seven years", "one year"], "a": 1, "e": "Around five years, children typically have developed sufficiently to produce longer coherent sentences."}, {"q": "As per Lev Vygotsky, as children grow, their language develops from ____.", "o": ["private speech to egocentric speech", "silent speech to thinking aloud", "think out loud to inner speech", "inner speech to external speech"], "a": 2, "e": "Vygotsky described development toward internalized or inner speech as overt speech becomes increasingly internal."}, {"q": "Piaget described cognitive development as occurring", "o": ["at three progressive levels", "as resolution of conflict at eight stages", "in a continuous manner from birth through adulthood", "in four qualitatively different stages"], "a": 3, "e": "Piaget proposed four qualitatively different stages of cognitive development: sensorimotor, preoperational, concrete operational and formal operational."}];
let idx=0,answers=Array(questions.length).fill(null),time=30*60,submitted=false;
const $=id=>document.getElementById(id);
function render(){
 const q=questions[idx];$("qno").textContent=`Question ${idx+1} of ${questions.length}`;$("counter").textContent=`${idx+1} / ${questions.length}`;$("question").innerHTML=q.q;
 $("options").innerHTML=q.o.map((x,i)=>`<button class="opt ${answers[idx]===i?'selected':''}" data-i="${i}">${String.fromCharCode(65+i)}. ${x}</button>`).join('');
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{answers[idx]=+b.dataset.i;render();});
 $("prev").disabled=idx===0;$("next").disabled=idx===questions.length-1;$("bar").style.width=((idx+1)/questions.length*100)+'%';
}
$("prev").onclick=()=>{if(idx>0){idx--;render()}};
$("next").onclick=()=>{if(idx<questions.length-1){idx++;render()}};
function submitTest(){
 if(submitted)return;submitted=true;clearInterval(timerId);
 let score=0,attempted=0,review='';
 questions.forEach((q,i)=>{
   const chosen=answers[i];if(chosen!==null)attempted++;if(chosen===q.a)score++;
   const cls=chosen===null?'unattempted':chosen===q.a?'correct':'wrong';
   const status=chosen===null?'Not Attempted':chosen===q.a?'Correct':'Wrong';
   review+=`<div class="review-item ${cls}"><b>Q${i+1}. ${status}</b><br>${q.q}<br><br><b>Your answer:</b> ${chosen===null?'Not Attempted':q.o[chosen]}<br><b>Correct answer:</b> ${q.o[q.a]}<br><b>Explanation:</b> ${q.e}</div>`;
 });
 const pct=Math.round(score/questions.length*100);
 $("quizCard").style.display='none';$("submit").style.display='none';$("result").style.display='block';
 $("score").textContent=`${score} / ${questions.length}`;
 $("summary").innerHTML=`<b>${pct}%</b> &nbsp; | &nbsp; Attempted: ${attempted} &nbsp; | &nbsp; Correct: ${score} &nbsp; | &nbsp; Wrong: ${attempted-score} &nbsp; | &nbsp; Unattempted: ${questions.length-attempted}`;
 $("review").innerHTML=review;window.scrollTo({top:0,behavior:'smooth'});
}
$("submit").onclick=()=>{if(confirm("Submit test?"))submitTest()};
$("restart").onclick=()=>location.reload();
let timerId=setInterval(()=>{if(submitted)return;time--;let m=Math.floor(time/60),s=time%60;$("timer").textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(time<=0)submitTest()},1000);
render();
</script>
</body>
</html>
